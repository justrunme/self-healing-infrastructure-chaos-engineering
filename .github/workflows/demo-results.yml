name: Demo results

on:
  workflow_dispatch:
  schedule:
    - cron: "7 6 * * 1"

permissions:
  contents: read

jobs:
  record-remediation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # upload demo-results artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install recorders
        run: |
          python -m pip install asciinema==2.4.0
          npm install -g svg-term-cli@2.1.1
      - name: Setup Minikube
        uses: ./.github/actions/setup-minikube
      - name: Build and load controller
        run: |
          cd kubernetes/self-healing
          docker build -t self-healing-controller:latest .
          minikube image load self-healing-controller:latest
      - name: Deploy controller and test-app
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci_e2e_helpers.sh
          source ./scripts/ci_e2e_helpers.sh
          kc create namespace self-healing || true
          kc apply -f kubernetes/self-healing/slack-secret.yaml
          kc apply -f kubernetes/self-healing/deployment.yaml
          kc apply -f kubernetes/test-app/test-app.yaml
          wait_controller_rollout self-healing 120
          kc rollout status deployment/test-app -n test-app --timeout=120s
          # Demo records live remediation; opt in explicitly
          kc set env deployment/self-healing-controller -n self-healing \
            DRY_RUN=false \
            REMEDIATION_NAMESPACES=test-app \
            POD_FAILURE_THRESHOLD=1
          wait_controller_rollout self-healing 120
      - name: Record fault-inject remediation demo
        run: |
          mkdir -p docs/assets
          asciinema rec --overwrite -c 'bash scripts/demo_remediation_record.sh' docs/assets/chaos-remediation.cast
          svg-term --in docs/assets/chaos-remediation.cast --out docs/assets/chaos-remediation.svg --window --width 100 --height 20 --no-cursor
          python3 scripts/write_demo_results.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-results
          path: |
            docs/assets/chaos-remediation.cast
            docs/assets/chaos-remediation.svg
            docs/results.json
