name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/self-healing-controller

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./kubernetes/self-healing
          file: ./kubernetes/self-healing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section for ${VERSION}" >&2
            exit 1
          fi
          {
            echo ""
            echo "### Images"
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}\`"
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${VERSION}\`"
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`"
          } >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release_notes.md

      - name: Update Terraform vars
        run: |
          if [ -f "terraform/terraform.tfvars" ]; then
            sed -i.bak \
              "s|self_healing_controller_image = \".*\"|self_healing_controller_image = \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}\"|" \
              terraform/terraform.tfvars
            echo "Updated terraform.tfvars to ${{ github.ref_name }}"
          else
            echo "terraform.tfvars not found, skipping update"
          fi

      - name: Commit Terraform update
        run: |
          if [ -f "terraform/terraform.tfvars" ]; then
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            git add terraform/terraform.tfvars
            git commit -m "chore: bump TF image to ${{ github.ref_name }}" || echo "No changes"
            git push
          else
            echo "terraform.tfvars not found, skipping commit"
          fi
