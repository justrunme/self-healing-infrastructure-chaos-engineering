name: Self-Healing Infrastructure CI/CD

on:
  push:
    branches: [main, develop, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/self-healing-controller
  IMAGE_TAG: ${{ github.sha }}

# ------------------------------------------------
jobs:
  # 1. Quality & Tests for Python + Terraform
  ci:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [python, terraform]
    steps:
      - uses: actions/checkout@v6

      - name: Cache pip dependencies
        if: matrix.tool == 'python'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('kubernetes/self-healing/requirements*.txt') }}
      
      - name: Cache Terraform plugins
        if: matrix.tool == 'terraform'
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tf-plugins-${{ hashFiles('terraform/**/*.tf') }}

      - name: Setup Python
        if: matrix.tool == 'python'
        uses: actions/setup-python@v6
        with: 
          python-version: '3.12'
      - name: Setup Terraform
        if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_version: '1.0.11'

      - name: Install dependencies
        if: matrix.tool == 'python'
        run: |
          pip install --upgrade pip
          # Сначала устанавливаем runtime зависимости контроллера
          pip install -r kubernetes/self-healing/requirements.txt
          # Затем dev-зависимости для тестов и линтинга
          pip install -r kubernetes/self-healing/requirements-dev.txt

      - name: Lint with Black & isort & Flake8
        if: matrix.tool == 'python'
        run: |
          black --check kubernetes/self-healing/
          isort --check-only kubernetes/self-healing/
          flake8 kubernetes/self-healing/ --max-line-length=120

      - name: Run unit tests with coverage
        if: matrix.tool == 'python'
        working-directory: kubernetes/self-healing
        run: |
          pytest \
            --maxfail=1 \
            --disable-warnings \
            -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=html
      
      - name: Upload coverage report
        if: matrix.tool == 'python'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: kubernetes/self-healing/htmlcov/
      - name: Configure Terraform plugin cache
        if: matrix.tool == 'terraform'
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Terraform Validate
        if: matrix.tool == 'terraform'
        run: |
          cd terraform
          terraform init
          terraform validate

  # 2. Build & Push Docker
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - uses: docker/build-push-action@v6
        with:
          context: ./kubernetes/self-healing
          file: ./kubernetes/self-healing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # 3. Infrastructure: Deploy with Terraform
  infra-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v6

      # 3.1 Setup Kubernetes
      - name: Setup Minikube
        uses: ./.github/actions/setup-minikube

      # 3.2 Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.0.11'

      # 3.3 Cache Terraform plugins
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tf-plugins-${{ hashFiles('terraform/**/*.tf') }}

      # 3.4 Configure Terraform plugin cache
      - name: Configure Terraform plugin cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV

      # 3.5 Deploy infrastructure
      - name: Terraform Init & Apply
        working-directory: terraform
        run: |
          terraform init
          terraform plan -var="ci_cd_mode=false" -out=tfplan
          terraform apply -auto-approve tfplan

      # 3.6 Ensure we talk to Minikube
      - name: Ensure we talk to Minikube
        run: |
          echo "Current context: $(kubectl config current-context)"
          kubectl cluster-info

      # 3.7 Debug: list namespaces
      - name: Debug list namespaces
        run: |
          kubectl get namespaces

      # 3.8 Create namespaces if missing
      - name: Create namespaces if missing
        run: |
          # Create self-healing namespace if missing
          if ! kubectl get ns self-healing &>/dev/null; then
            echo "❗️ Namespace self-healing not found, creating..."
            kubectl create namespace self-healing
          else
            echo "✅ Namespace self-healing already exists"
          fi
          
          # Create test-app namespace if missing
          if ! kubectl get ns test-app &>/dev/null; then
            echo "❗️ Namespace test-app not found, creating..."
            kubectl create namespace test-app
          else
            echo "✅ Namespace test-app already exists"
          fi

      # 3.9 Wait for deployments to be ready
      - name: Wait for Self-Healing Controller to be ready
        run: |
          echo "🚀 Waiting for Self-Healing Controller to be ready..."
          # Use minikube kubectl to ensure we're using the right context
          minikube kubectl -- rollout status deployment/self-healing-controller \
            -n self-healing \
            --timeout=60s
      
      - name: Wait for test-app to be ready
        run: |
          echo "🚀 Waiting for test-app to be ready..."
          # Use minikube kubectl to ensure we're using the right context
          minikube kubectl -- rollout status deployment/test-app \
            -n test-app \
            --timeout=60s
      
      # 3.7 Debug test-app on failure
      - name: Debug test-app (on failure)
        if: failure()
        run: |
          echo "=== Pods in test-app namespace ==="
          kubectl get pods -n test-app -o wide
          
          echo "=== Describe Deployment ==="
          kubectl describe deployment/test-app -n test-app
          
          echo "=== Describe Pods ==="
          kubectl describe pods -l app=test-app -n test-app
          
          echo "=== Logs from test-app pods ==="
          kubectl logs -l app=test-app -n test-app --tail=50 || echo "No logs available"
          
          echo "=== Events in test-app namespace ==="
          kubectl get events -n test-app --sort-by='.lastTimestamp' | tail -20

      # 3.8 Wait for metrics-server
      - name: Wait for metrics-server
        run: |
          echo "🚀 Waiting for metrics-server to be ready..."
          kubectl wait --for=condition=available deployment/metrics-server -n kube-system --timeout=60s || echo "Metrics-server not ready yet"

      # 3.9 Basic smoke test
      - name: Smoke Test
        run: |
          kubectl get ns self-healing monitoring chaos-engineering
          kubectl get pods --all-namespaces

  # 4. Self-Healing Controller Tests
  self-healing-test:
    name: Self-Healing Controller Tests
    runs-on: ubuntu-latest
    needs: infra-deploy
    steps:
      - uses: actions/checkout@v6
      - name: Setup Minikube
        uses: ./.github/actions/setup-minikube

      - name: Load Docker image
        run: |
          cd kubernetes/self-healing
          docker build -t self-healing-controller:latest .
          minikube image load self-healing-controller:latest

      # Deploy self-healing controller
      - name: Deploy self-healing controller
        run: |
          echo "📦 Creating self-healing namespace..."
          minikube kubectl -- create namespace self-healing || true
          
          echo "📦 Creating slack secret..."
          minikube kubectl -- apply -f kubernetes/self-healing/slack-secret.yaml
          
          echo "📦 Deploying self-healing controller..."
          minikube kubectl -- apply -f kubernetes/self-healing/deployment.yaml
          
          echo "📦 Deploying test-app..."
          minikube kubectl -- apply -f kubernetes/test-app/test-app.yaml

      - name: Wait for components to be ready
        run: |
          echo "🚀 Waiting for Self-Healing Controller to roll out..."
          minikube kubectl -- rollout status deployment/self-healing-controller -n self-healing --timeout=120s
          
          echo "🚀 Waiting for test-app to roll out..."
          minikube kubectl -- rollout status deployment/test-app -n test-app --timeout=120s

      - name: Test Self-Healing Controller health
        run: |
          set -euo pipefail
          ./scripts/port_forward_leader.sh self-healing 8081 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 8

          curl -f http://localhost:8081/health
          curl -f http://localhost:8081/metrics
          curl -s http://localhost:8081/metrics | grep -q 'self_healing_is_leader 1' \
            || (echo "Port-forward is not attached to the leader" && exit 1)

          curl -s http://localhost:8081/metrics | grep -q "remediations_total" || (echo "Missing remediations_total metric" && exit 1)
          curl -s http://localhost:8081/metrics | grep -q "brake_engaged" || (echo "Missing brake_engaged metric" && exit 1)
          curl -s http://localhost:8081/metrics | grep -q "remediation_budget_remaining" || (echo "Missing remediation_budget_remaining metric" && exit 1)
          curl -s http://localhost:8081/metrics | grep -q "remediation_skips_total" || (echo "Missing remediation_skips_total metric" && exit 1)

          # Verify safe defaults are set on the Deployment
          dry_run=$(minikube kubectl -- get deploy self-healing-controller -n self-healing \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="DRY_RUN")].value}')
          allowlist=$(minikube kubectl -- get deploy self-healing-controller -n self-healing \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="REMEDIATION_NAMESPACES")].value}')
          test "$dry_run" = "true" || (echo "Expected DRY_RUN=true by default, got: $dry_run" && exit 1)
          test -z "$allowlist" || (echo "Expected empty REMEDIATION_NAMESPACES by default, got: $allowlist" && exit 1)

      - name: NEGATIVE - defaults must not delete unhealthy pods
        run: |
          set -euo pipefail
          echo "Injecting crashloop under default dry-run (must NOT delete; only dry_run metric)..."
          minikube kubectl -- apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: dry-run-neg
            namespace: test-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: dry-run-neg
            template:
              metadata:
                labels:
                  app: dry-run-neg
              spec:
                containers:
                  - name: crash
                    image: busybox:1.36
                    command: ["/bin/sh", "-c", "exit 1"]
          EOF

          ./scripts/port_forward_leader.sh self-healing 8086 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 5

          found=0
          for _ in $(seq 1 24); do
            metrics=$(curl -sf http://localhost:8086/metrics || true)
            if echo "$metrics" | grep -E 'remediations_total\{[^}]*result="dry_run"'; then
              found=1
              break
            fi
            sleep 5
          done

          if [ "$found" -ne 1 ]; then
            echo "Expected dry_run remediation metric under defaults"
            curl -s http://localhost:8086/metrics || true
            minikube kubectl -- logs -n self-healing deploy/self-healing-controller --tail=80
            exit 1
          fi

          if echo "$(curl -sf http://localhost:8086/metrics || true)" | grep -E 'remediations_total\{[^}]*result="success"'; then
            echo "Defaults must not produce live success remediations"
            exit 1
          fi

          minikube kubectl -- delete deployment dry-run-neg -n test-app --wait=true
          echo "NEGATIVE defaults test passed (dry-run only, no delete)"

      - name: NEGATIVE - live mode outside allowlist must not delete
        run: |
          set -euo pipefail
          echo "Setting DRY_RUN=false with allowlist excluding test-app..."
          minikube kubectl -- set env deployment/self-healing-controller -n self-healing \
            DRY_RUN=false \
            REMEDIATION_NAMESPACES=other-ns
          minikube kubectl -- rollout status deployment/self-healing-controller -n self-healing --timeout=90s

          minikube kubectl -- apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: allowlist-neg
            namespace: test-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: allowlist-neg
            template:
              metadata:
                labels:
                  app: allowlist-neg
              spec:
                containers:
                  - name: crash
                    image: busybox:1.36
                    command: ["/bin/sh", "-c", "exit 1"]
          EOF

          ./scripts/port_forward_leader.sh self-healing 8087 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 5

          refused=0
          for _ in $(seq 1 24); do
            metrics=$(curl -sf http://localhost:8087/metrics || true)
            if echo "$metrics" | grep -E 'remediations_total\{[^}]*result="brake_engaged"'; then
              refused=1
              break
            fi
            if echo "$metrics" | grep -E 'brake_engaged\{[^}]*reason="namespace_not_allowed"'; then
              refused=1
              break
            fi
            sleep 5
          done

          if [ "$refused" -ne 1 ]; then
            echo "Expected allowlist refusal (brake) for namespace outside allowlist"
            curl -s http://localhost:8087/metrics || true
            minikube kubectl -- logs -n self-healing deploy/self-healing-controller --tail=80
            exit 1
          fi

          if echo "$(curl -sf http://localhost:8087/metrics || true)" | grep -E 'remediations_total\{[^}]*namespace="test-app"[^}]*result="success"'; then
            echo "Pod outside allowlist must not be live-remediated"
            exit 1
          fi

          minikube kubectl -- delete deployment allowlist-neg -n test-app --wait=true
          echo "NEGATIVE allowlist test passed (no delete outside allowlist)"

      - name: Enable live remediation for test-app
        run: |
          set -euo pipefail
          echo "Enabling live remediation: DRY_RUN=false REMEDIATION_NAMESPACES=test-app"
          minikube kubectl -- set env deployment/self-healing-controller -n self-healing \
            DRY_RUN=false \
            REMEDIATION_NAMESPACES=test-app
          minikube kubectl -- rollout status deployment/self-healing-controller -n self-healing --timeout=90s

      - name: Test bounded pod failure recovery
        run: |
          set -euo pipefail
          echo "Injecting crashlooping deployment (controller remediates by deleting the pod)..."
          minikube kubectl -- apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: crash-heal
            namespace: test-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: crash-heal
            template:
              metadata:
                labels:
                  app: crash-heal
              spec:
                containers:
                  - name: crash
                    image: busybox:1.36
                    command: ["/bin/sh", "-c", "exit 1"]
          EOF

          ./scripts/port_forward_leader.sh self-healing 8082 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 5

          found=0
          for _ in $(seq 1 24); do
            metrics=$(curl -sf http://localhost:8082/metrics || true)
            if echo "$metrics" | grep -E 'remediations_total\{[^}]*result="success"'; then
              found=1
              break
            fi
            sleep 5
          done

          if [ "$found" -ne 1 ]; then
            echo "Controller did not record a successful remediation within 120s"
            curl -s http://localhost:8082/metrics || true
            minikube kubectl -- logs -n self-healing deploy/self-healing-controller --tail=80
            minikube kubectl -- get pods -n test-app -o wide
            minikube kubectl -- get events -n test-app --sort-by='.lastTimestamp' | tail -20
            exit 1
          fi

          minikube kubectl -- get deployment crash-heal -n test-app
          minikube kubectl -- delete deployment crash-heal -n test-app --wait=true
          echo "Controller remediating crashlooping deployment and deployment still present"

      - name: Test bare pods are skipped
        run: |
          set -euo pipefail
          echo "Creating bare Failed pod (must not be deleted)..."
          minikube kubectl -- run bare-skip-pod --image=busybox:1.36 --restart=Never \
            -n test-app --command -- /bin/sh -c "exit 1"

          ./scripts/port_forward_leader.sh self-healing 8084 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 5

          found=0
          for _ in $(seq 1 24); do
            metrics=$(curl -sf http://localhost:8084/metrics || true)
            if echo "$metrics" | grep -E 'remediations_total\{[^}]*result="skipped_unowned"'; then
              found=1
              break
            fi
            if echo "$metrics" | grep -E 'remediation_skips_total\{[^}]*reason="unowned"'; then
              found=1
              break
            fi
            sleep 5
          done

          if [ "$found" -ne 1 ]; then
            echo "Controller did not record skipped_unowned for bare pod"
            curl -s http://localhost:8084/metrics || true
            minikube kubectl -- logs -n self-healing deploy/self-healing-controller --tail=80
            exit 1
          fi

          if ! minikube kubectl -- get pod bare-skip-pod -n test-app >/dev/null 2>&1; then
            echo "Bare pod was deleted; expected skip"
            exit 1
          fi
          minikube kubectl -- delete pod bare-skip-pod -n test-app --ignore-not-found=true
          echo "Bare pod correctly skipped"

      - name: Verify least-privilege RBAC
        run: |
          set -euo pipefail
          SA=system:serviceaccount:self-healing:self-healing-controller
          if minikube kubectl -- auth can-i delete secrets --as="$SA" -A | grep -qi '^yes$'; then
            echo "SA must not be able to delete secrets cluster-wide"
            exit 1
          fi
          if minikube kubectl -- auth can-i create deployments --as="$SA" -A | grep -qi '^yes$'; then
            echo "SA must not be able to create deployments cluster-wide"
            exit 1
          fi
          minikube kubectl -- auth can-i delete pods --as="$SA" -A | grep -qi '^yes$'
          minikube kubectl -- auth can-i create events --as="$SA" -A | grep -qi '^yes$'
          minikube kubectl -- auth can-i update leases --as="$SA" -n self-healing | grep -qi '^yes$'
          echo "RBAC least-privilege checks passed"

      - name: Test remediation brake with budget exhaustion
        run: |
          set -euo pipefail
          echo "Testing remediation brake with budget exhaustion..."

          minikube kubectl -- set env deployment/self-healing-controller -n self-healing \
            REMEDIATION_BUDGET_PER_NAMESPACE=2 \
            REMEDIATION_BUDGET_PER_WORKLOAD=1 \
            REMEDIATION_COOLDOWN_SECONDS=1
          minikube kubectl -- rollout status deployment/self-healing-controller -n self-healing --timeout=90s

          for i in 1 2 3 4 5; do
            minikube kubectl -- apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: brake-test-$i
            namespace: test-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: brake-test-$i
            template:
              metadata:
                labels:
                  app: brake-test-$i
              spec:
                containers:
                  - name: crash
                    image: busybox:1.36
                    command: ["/bin/sh", "-c", "exit 1"]
          EOF
          done

          ./scripts/port_forward_leader.sh self-healing 8083 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 5
          curl -sf http://localhost:8083/metrics | grep -q 'self_healing_is_leader 1'

          engaged=0
          for _ in $(seq 1 24); do
            metrics=$(curl -sf http://localhost:8083/metrics || true)
            if echo "$metrics" | grep -E 'brake_engaged\{[^}]*reason="budget_exhausted"[^}]*\} 1'; then
              engaged=1
              break
            fi
            if echo "$metrics" | grep -E 'remediations_total\{[^}]*result="brake_engaged"'; then
              engaged=1
              break
            fi
            sleep 5
          done

          if [ "$engaged" -ne 1 ]; then
            echo "Brake did not engage after budget exhaustion"
            curl -s http://localhost:8083/metrics || true
            minikube kubectl -- logs -n self-healing deploy/self-healing-controller --tail=80
            minikube kubectl -- get pods -n test-app -o wide
            exit 1
          fi

          curl -sf http://localhost:8083/metrics | grep 'remediation_budget_remaining'
          echo "Brake engaged after budget exhaustion"

          for i in 1 2 3 4 5; do
            minikube kubectl -- delete deployment "brake-test-$i" -n test-app --ignore-not-found=true
          done

  # 5. Monitoring Tests
  monitoring-test:
    name: Monitoring Tests
    runs-on: ubuntu-latest
    needs: infra-deploy
    steps:
      - uses: actions/checkout@v6
      - name: Setup Minikube
        uses: ./.github/actions/setup-minikube

      - name: Load Docker image
        run: |
          cd kubernetes/self-healing
          docker build -t self-healing-controller:latest .
          minikube image load self-healing-controller:latest

      # Ensure monitoring namespace exists
      - name: Ensure monitoring namespace
        run: |
          if ! minikube kubectl -- get namespace monitoring &>/dev/null; then
            echo "⚠️ Namespace 'monitoring' not found—creating it for tests"
            minikube kubectl -- create namespace monitoring
          else
            echo "✅ Namespace 'monitoring' exists"
          fi

      - name: Wait for Prometheus stack to roll out
        run: |
          echo "🚀 Waiting for Prometheus rollout..."
          minikube kubectl -- rollout status deployment/prometheus-kube-prometheus-prometheus \
            -n monitoring --timeout=120s || echo "Prometheus deployment not found, skipping"

      - name: Wait for Grafana rollout
        run: |
          echo "🚀 Waiting for Grafana rollout..."
          minikube kubectl -- rollout status deployment/prometheus-grafana \
            -n monitoring --timeout=120s || echo "Grafana deployment not found, skipping"

      - name: Test Prometheus connectivity
        run: |
          if minikube kubectl -- get svc prometheus-kube-prometheus-prometheus -n monitoring &>/dev/null; then
            minikube kubectl -- port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090 &
            PF_PID=$!
            sleep 5
            curl -f http://localhost:9090/api/v1/query?query=up || echo "Prometheus connectivity test failed"
            curl -f "http://localhost:9090/api/v1/query?query=up{job=\"self-healing-controller\"}" || echo "No self-healing metrics yet"
            kill $PF_PID
          else
            echo "⚠️ Prometheus service missing, skipping connectivity test"
          fi

      - name: Test Grafana connectivity
        run: |
          if minikube kubectl -- get svc prometheus-grafana -n monitoring &>/dev/null; then
            minikube kubectl -- port-forward -n monitoring svc/prometheus-grafana 3000:3000 &
            PF_PID=$!
            sleep 5
            curl -f http://localhost:3000/api/health || echo "Grafana connectivity test failed"
            kill $PF_PID
          else
            echo "⚠️ Grafana service missing, skipping connectivity test"
          fi

  # 6. Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [self-healing-test, monitoring-test]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Minikube
        uses: ./.github/actions/setup-minikube

      # 1) Убедимся, что namespace test-app есть
      - name: Ensure test-app namespace exists
        run: |
          if ! minikube kubectl -- get namespace test-app &>/dev/null; then
            echo "⚠️ Namespace 'test-app' not found—creating it for integration tests"
            minikube kubectl -- create namespace test-app
          else
            echo "✅ Namespace 'test-app' exists"
          fi

      # 2) Проверяем Kured
      - name: Test Kured integration
        run: |
          echo "🔍 Checking Kured in kured namespace..."
          if minikube kubectl -- get namespace kured &>/dev/null; then
            if minikube kubectl -- get pods -n kured | grep Running; then
              echo "✅ Kured is running"
            else
              echo "⚠️ No Running Kured pods found"
            fi
            minikube kubectl -- describe daemonset kured -n kured || echo "Kured daemonset not found"
          else
            echo "⚠️ Namespace 'kured' not found—skipping Kured tests"
          fi

      # 3) Проверяем PrometheusRules / Alertmanager
      - name: Test monitoring alerts
        run: |
          echo "🔍 Checking PrometheusRules and Alertmanager config..."
          # PrometheusRules CRD может не быть в кластере, поэтому guard-clause
          if minikube kubectl -- api-resources | grep -q prometheusrules; then
            minikube kubectl -- get prometheusrules -n monitoring || echo "No PrometheusRules found"
          else
            echo "⚠️ CRD 'prometheusrules' not present—skipping"
          fi
          # Alertmanager ConfigMap
          if minikube kubectl -- get namespace monitoring &>/dev/null; then
            minikube kubectl -- get configmap -n monitoring | grep alertmanager || echo "No Alertmanager config found"
          else
            echo "⚠️ Namespace 'monitoring' not found—skipping Alertmanager config test"
          fi

      # 4) Проверяем test-app
      - name: Test test application
        run: |
          echo "🔍 Checking test-app pods in test-app namespace..."
          if minikube kubectl -- get namespace test-app &>/dev/null; then
            if minikube kubectl -- get pods -n test-app | grep Running; then
              echo "✅ test-app pods are running"
            else
              echo "❌ No Running pods in test-app namespace"
            fi
          else
            echo "⚠️ Namespace 'test-app' not found—skipping test-app checks"
          fi

      - name: Test application accessibility
        run: |
          echo "🔍 Testing test-app service..."
          if minikube kubectl -- get svc test-app -n test-app &>/dev/null; then
            minikube kubectl -- port-forward -n test-app svc/test-app 8080:80 &
            PF_PID=$!
            sleep 5
            if curl -sf http://localhost:8080; then
              echo "✅ test-app service is accessible"
            else
              echo "❌ test-app service not accessible"
            fi
            kill $PF_PID
          else
            echo "⚠️ Service 'test-app' not found—skipping accessibility test"
          fi

      - name: Test HPA functionality
        run: |
          echo "🔍 Checking HPA in test-app namespace..."
          if minikube kubectl -- get hpa -n test-app &>/dev/null; then
            minikube kubectl -- describe hpa test-app-hpa -n test-app || echo "HPA exists but describe failed"
          else
            echo "⚠️ HPA 'test-app-hpa' not found—skipping HPA checks"
          fi

  # 7. Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v6
      - name: Setup Minikube
        uses: ./.github/actions/setup-minikube

      - name: Load Docker image
        run: |
          cd kubernetes/self-healing
          docker build -t self-healing-controller:latest .
          minikube image load self-healing-controller:latest

      - name: Deploy controller and test-app
        run: |
          minikube kubectl -- create namespace self-healing || true
          minikube kubectl -- apply -f kubernetes/self-healing/slack-secret.yaml
          minikube kubectl -- apply -f kubernetes/self-healing/deployment.yaml
          minikube kubectl -- apply -f kubernetes/test-app/test-app.yaml
          minikube kubectl -- rollout status deployment/self-healing-controller -n self-healing --timeout=120s
          minikube kubectl -- rollout status deployment/test-app -n test-app --timeout=120s
          # Live remediation tests below require explicit opt-in
          minikube kubectl -- set env deployment/self-healing-controller -n self-healing \
            DRY_RUN=false \
            REMEDIATION_NAMESPACES=test-app
          minikube kubectl -- rollout status deployment/self-healing-controller -n self-healing --timeout=90s

      - name: Test resource limits
        run: |
          echo "🔍 Describing nodes and testing metrics..."
          minikube kubectl -- describe nodes
          minikube kubectl -- top nodes || echo "⚠️ Metrics server not available"

      - name: Test scalability
        run: |
          echo "🔍 Scaling test-app..."
          if minikube kubectl -- get deployment test-app -n test-app &>/dev/null; then
            minikube kubectl -- scale deployment test-app -n test-app --replicas=5
            minikube kubectl -- wait --for=condition=available deployment/test-app \
              -n test-app --timeout=300s
            running_pods=$(minikube kubectl -- get pods -n test-app \
              --field-selector=status.phase=Running \
              -o name | wc -l)
            echo "Running pods: $running_pods"
            if [ "$running_pods" -ge 3 ]; then
              echo "✅ Scaling test passed"
            else
              echo "❌ Scaling test failed"
              exit 1
            fi
          else
            echo "⚠️ Deployment 'test-app' not found—skipping scalability test"
          fi

      - name: Test multiple owned workload failures
        run: |
          echo "🔍 Testing multiple controller-owned workload failures..."
          if minikube kubectl -- get namespace test-app &>/dev/null; then
            for i in 1 2 3; do
              minikube kubectl -- apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-fail-$i
            namespace: test-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-fail-$i
            template:
              metadata:
                labels:
                  app: test-fail-$i
              spec:
                containers:
                  - name: crash
                    image: busybox:1.36
                    command: ["/bin/sh", "-c", "exit 1"]
          EOF
            done

            ./scripts/port_forward_leader.sh self-healing 8085 &
            PF_PID=$!
            trap 'kill $PF_PID 2>/dev/null || true' EXIT
            sleep 5

            found=0
            for _ in $(seq 1 24); do
              metrics=$(curl -sf http://localhost:8085/metrics || true)
              success_count=$(echo "$metrics" | grep -c 'result="success"' || true)
              if [ "${success_count:-0}" -ge 1 ]; then
                found=1
                break
              fi
              sleep 5
            done

            for i in 1 2 3; do
              minikube kubectl -- delete deployment "test-fail-$i" -n test-app --ignore-not-found=true
            done

            if [ "$found" -eq 1 ]; then
              echo "✅ Multiple owned workload failure test passed"
            else
              echo "❌ Multiple owned workload failure test failed"
              curl -s http://localhost:8085/metrics || true
              exit 1
            fi
          else
            echo "⚠️ Namespace 'test-app' not found—skipping multiple pod failure test"
          fi

  # 8. Cleanup & Report
  cleanup:
    name: Cleanup & Report
    runs-on: ubuntu-latest
    needs: [performance-tests]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Setup Minikube
        uses: ./.github/actions/setup-minikube

      - name: Collect logs
        run: |
          minikube kubectl -- get pods --all-namespaces >> system-report.txt
          minikube kubectl -- logs -n self-healing deployment/self-healing-controller --tail=50 >> system-report.txt || echo "No self-healing logs available" >> system-report.txt
          minikube kubectl -- get events --all-namespaces --sort-by='.lastTimestamp' | tail -20 >> system-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v5
        with:
          name: system-report
          path: system-report.txt

      - name: Cleanup test resources
        if: always()
        run: |
          minikube kubectl -- delete pod -l test=true -n test-app --ignore-not-found=true
          minikube kubectl -- delete pod test-healing-pod -n test-app --ignore-not-found=true
          minikube kubectl -- delete pod test-crash-pod -n test-app --ignore-not-found=true
