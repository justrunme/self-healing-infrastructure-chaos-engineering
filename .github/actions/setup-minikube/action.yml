name: 'Setup Minikube'
description: 'Install and configure Minikube with Docker driver'

runs:
  using: "composite"
  steps:
    - name: Install Minikube
      shell: bash
      run: |
        set -euo pipefail
        MINIKUBE_VERSION=v1.39.0
        # sha256 from https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64.sha256
        MINIKUBE_SHA256=b738496da01be06bbaf80c688f57ce25acd3849fbb518155f3a88e03ef555aa4
        curl -fsSLO "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64"
        echo "${MINIKUBE_SHA256}  minikube-linux-amd64" | sha256sum -c -
        sudo install minikube-linux-amd64 /usr/local/bin/minikube
        rm -f minikube-linux-amd64
    
    - name: Start Minikube
      shell: bash
      run: |
        minikube start --driver=docker --cpus=2 --memory=4096
        minikube addons enable metrics-server
    
    - name: Configure Kubeconfig
      shell: bash
      run: |
        mkdir -p $HOME/.kube
        minikube update-context
        kubectl config current-context
        # Set both KUBECONFIG and KUBE_CONFIG_PATH for Terraform compatibility
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
        echo "KUBE_CONFIG_PATH=$HOME/.kube/config" >> $GITHUB_ENV
        echo "Current KUBECONFIG: $KUBECONFIG"
        echo "Current KUBE_CONFIG_PATH: $KUBE_CONFIG_PATH"
